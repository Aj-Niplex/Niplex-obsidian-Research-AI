name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v7

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest main bundle
              uses: actions/attest@v4
              with:
                  subject-path: main.js

            - name: Attest styles.css
              if: steps.styles.outputs.exists == 'true'
              uses: actions/attest@v4
              with:
                  subject-path: styles.css

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  assets=("main.js" "manifest.json")
                  if [ "${{ steps.styles.outputs.exists }}" = "true" ]; then
                    assets+=("styles.css")
                  fi
                  gh release create "$tag" --title="$tag" --draft "${assets[@]}"
